name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          # Run static analysis on the highest supported PHP so version-sensitive
          # findings on 8.3/8.4/8.5 are exercised, not only 8.2.
          php-version: '8.5'
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - name: PHP_CodeSniffer (PSR-12)
        run: vendor/bin/phpcs
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  test:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.dependencies }} deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        # `highest` is what a fresh consumer install resolves to. `lowest` is the floor
        # our own constraints advertise — without this leg the declared minimums are
        # never executed, so a stale floor (e.g. an unpatched guzzle) passes CI unnoticed.
        # Expect deprecation notices on the lowest leg for PHP 8.4/8.5: they come from the
        # oldest php-http/mock-client (a dev dependency, never installed by consumers) and
        # have no deprecation-free upstream release. They do not fail the suite.
        dependencies: [highest, lowest]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
      - name: Install dependencies (${{ matrix.dependencies }})
        run: |
          if [ "${{ matrix.dependencies }}" = "lowest" ]; then
            composer update --no-interaction --no-progress --prefer-lowest --prefer-stable
          else
            composer update --no-interaction --no-progress
          fi
      - name: PHPUnit
        run: vendor/bin/phpunit --testsuite unit

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      # No composer.lock is committed (this is a library), so resolve first and audit the
      # tree a consumer would actually get. Audited at both ends of the declared range:
      # an advisory against the floor is the failure mode a `highest`-only audit misses.
      - name: Audit (highest)
        run: |
          composer update --no-interaction --no-progress
          composer audit --no-interaction
      # `--abandoned=report` on this leg only: composer audit fails on abandoned packages by
      # default, and the oldest php-http/* dev transitives pull in php-http/message-factory,
      # which is abandoned upstream and unavoidable at this resolution. Security advisories
      # still fail the build — the flag downgrades the abandoned check and nothing else.
      - name: Audit (lowest)
        run: |
          composer update --no-interaction --no-progress --prefer-lowest --prefer-stable
          composer audit --no-interaction --abandoned=report
